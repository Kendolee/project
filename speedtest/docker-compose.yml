services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    container_name: speedtest-tracker
    ports:
      - 8070:80
    environment:
      - PUID=1000
      - PGID=1000
      - APP_KEY=base64:dpN+mMA3WmphYJYEuBD+7nz6Evh7mZpyPlOUjjWUmeU=
      - SPEEDTEST_SCHEDULE=0 * * * *
      - DISPLAY_TIMEZONE=Europe/London
      - APP_DEBUG=true
    volumes:
      - ./speedtest:/config

